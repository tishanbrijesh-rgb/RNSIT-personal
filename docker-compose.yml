services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ecdat
      POSTGRES_PASSWORD: ${ECDAT_DB_PASSWORD:?Configure ECDAT_DB_PASSWORD}
      POSTGRES_DB: ecdat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecdat"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ECDAT_ENV: production
      DATABASE_URL: postgresql://ecdat:${ECDAT_DB_PASSWORD:?Configure ECDAT_DB_PASSWORD}@db:5432/ecdat
      SCANNER_PATH: /app
      ECDAT_ALLOWED_SCAN_ROOTS: /test-repo
      ECDAT_CORS_ORIGINS: http://localhost:3000
      ECDAT_ALLOW_ROLE_HEADER: "false"
      ECDAT_SCAN_TIMEOUT_SECONDS: ${ECDAT_SCAN_TIMEOUT_SECONDS:-300}
      ECDAT_MAX_FILE_BYTES: ${ECDAT_MAX_FILE_BYTES:-8388608}
      ECDAT_AUTO_CREATE_TABLES: "false"
      ECDAT_MAX_SCAN_FILES: ${ECDAT_MAX_SCAN_FILES:-100000}
      ECDAT_MAX_WORKER_RESULT_BYTES: ${ECDAT_MAX_WORKER_RESULT_BYTES:-33554432}
      ECDAT_LOG_DIR: /tmp/ecdat-logs
      ECDAT_RUNTIME_DIR: /tmp/ecdat-runtime
      ECDAT_USERS_JSON: ${ECDAT_USERS_JSON:?Configure ECDAT_USERS_JSON}
      ECDAT_TOKEN_SECRET: ${ECDAT_TOKEN_SECRET:?Configure ECDAT_TOKEN_SECRET}
    volumes:
      - ./scanner:/app/scanner:ro
      - ./test-repo:/test-repo:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://ecdat:${ECDAT_DB_PASSWORD:?Configure ECDAT_DB_PASSWORD}@db:5432/ecdat
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
